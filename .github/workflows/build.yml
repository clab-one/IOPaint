# folio-iopaint 이미지 빌드 → GHCR → digest 고정 커밋.
#
# GitHub 호스티드 러너에서 돈다. 이 저장소는 public 이고, clab-cluster 의
# 셀프호스티드 러너는 private 저장소에만 붙인다 - public 에 붙이면 fork PR 이
# 워크플로를 고쳐 노드에서 임의 코드를 돌릴 경로가 열리고 Free 플랜에는 그것을
# 막을 runner group 이 없다. public 저장소는 호스티드가 무료이므로 손해도 없다.
#
# Argo CD 는 아래 digest 커밋을 따라 롤아웃한다. 이 워크플로가 배포의 유일한 경로다.
name: build

on:
  push:
    branches: [folio-vendor]
    paths:
      - "iopaint/**"
      - "Dockerfile"
      # 빌드 컨텍스트를 바꾸므로 이미지가 달라진다.
      - ".dockerignore"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/build.yml"
      # 테스트는 이미지에 들어가지만 런타임 동작을 바꾸지 않는다. 이게 빌드를
      # 유발하면 digest 가 바뀌고 Argo 가 selfHeal 로 즉시 따라가 승인 없이
      # 파드를 재생성한다 - 실제로 한 번 그렇게 됐다.
      #
      # paths 와 paths-ignore 는 같은 이벤트에 함께 못 쓴다(워크플로가 로드조차
      # 되지 않는다). 부정 패턴으로 뺀다 - 뒤 패턴이 앞을 덮으므로 순서가 중요하다.
      - "!iopaint/tests/**"

  workflow_dispatch:

env:
  IMAGE: ghcr.io/clab-one/folio-iopaint

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 이미지를 만들기 전에 배포 불변식을 검사한다.
  #
  # 왜 별도 잡인가 - 가중치 출처가 어긋난 상태로 네 번 배포됐다. 매번 사람이
  # 두 파일을 대조하는 것으로는 못 막는다. 검사는 이미 test_deploy_consistency
  # 에 있었지만 **아무도 실행하지 않았다** - 테스트 경로는 빌드 트리거에서도
  # 빠져 있어서 로컬에서 돌릴 때만 유효했다. 여기서 돌려야 계약이 된다.
  #
  # 이 잡이 실패하면 build 가 시작되지 않고, 따라서 digest 도 바뀌지 않는다.
  # torch 는 설치하지 않는다 - 이 검사는 Dockerfile 과 매니페스트를 읽을 뿐이라
  # pytest 와 pyyaml 이면 충분하고, 몇 초에 끝난다.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest pyyaml
      - name: 배포 불변식
        run: pytest iopaint/tests/test_deploy_consistency.py -q

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # provenance attestation 은 빌드 시각과 run id 를 담아 소스가 같아도
          # index digest 를 매번 바꾼다. 켜 두면 아무것도 안 바뀐 빌드가 배포
          # 커밋을 만들고 파드를 재시작시킨다.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: pin digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          KFILE=deploy/kustomization.yaml
          # 형식이 계약이다. 어긋나면 조용히 지나가지 말고 여기서 죽는다.
          grep -qx -- "- name: ${IMAGE}" "$KFILE"
          test "$(grep -c '^  digest: sha256:' "$KFILE")" = "1"
          sed -i "s|^  digest: sha256:.*|  digest: ${DIGEST}|" "$KFILE"
          grep -qx -- "  digest: ${DIGEST}" "$KFILE"

          if git diff --quiet -- "$KFILE"; then
            echo "digest 변화 없음"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KFILE"
          git commit -m "deploy: folio-iopaint ${DIGEST}"

          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          echo "digest 커밋 push 실패" >&2
          exit 1
