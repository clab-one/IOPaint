# 배포 불변식 검사 — 이미지를 만들지 않는다.
#
# build.yml 도 같은 검사를 돌리지만 트리거가 다르다. build 는 코드와
# Dockerfile 이 바뀔 때만 돈다 - 매니페스트가 빌드를 유발하면 digest 가 바뀌고
# Argo 가 승인 없이 파드를 재생성하기 때문이다(실제로 한 번 그랬다).
#
# 그런데 불변식을 깨는 방법은 양쪽에 있다. Dockerfile 에서 가중치 굽기를
# 빼는 것과, Deployment 에서 PVC 마운트를 빼는 것은 결과가 같다 - 파드가
# 매 기동마다 인터넷에서 205MB 를 받는다. 그래서 매니페스트 쪽에도 검사가
# 필요하고, 그 검사는 빌드를 유발하지 않아야 한다.
#
# 두 워크플로가 같은 파일을 돌리는 것은 중복이 아니라 두 입구를 막는 것이다.
name: validate

on:
  push:
    branches: [folio-vendor]
    paths:
      - "deploy/**"
      - "iopaint/tests/test_deploy_consistency.py"
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest pyyaml
      - name: 배포 불변식
        run: pytest iopaint/tests/test_deploy_consistency.py -q
