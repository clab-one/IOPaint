# 일회성 선인출.
#
# PVC 를 만들고 곧바로 Deployment 를 바꾸면 첫 롤아웃이 205MB 다운로드를
# 기다리고, strategy 가 Recreate 라 그동안 서비스가 없다. 그래서 전환 전에
# 현재 이미지에 이미 구워져 있는 가중치를 PVC 로 복사해 둔다 - 다운로드가
# 아예 없다.
#
# PVC 를 /models 가 아니라 /pvc 에 붙인다. /models 에 붙이면 마운트가 이미지
# 레이어의 가중치를 가려서 복사 원본이 빈 디렉터리가 된다.
#
# 이 파일은 임시다. 완료를 확인한 뒤 제거 커밋으로 지운다(Argo prune).
#
# 이름에 -2 가 붙은 이유: Job 은 불변이라 spec 을 고쳐도 Argo 가 갱신하지 못한다.
# 이름을 바꾸면 새로 만들고 옛것은 prune 된다 - 수동 삭제가 필요 없다.
apiVersion: batch/v1
kind: Job
metadata:
  name: folio-ai-models-prefill-2
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: prefill
          image: ghcr.io/clab-one/folio-iopaint
          command:
            - sh
            - -c
            - |
              set -eu
              echo "IMAGE:"; find /models -name '*.pt' -exec ls -lh {} +
              # cp -a 는 마운트 루트에 시각을 쓰려다 실패한다
              #   cp: preserving times for '/pvc/.': Operation not permitted
              cp -r /models/. /pvc/
              echo "PVC:";   find /pvc -name '*.pt' -exec ls -lh {} +
              md5sum /pvc/torch/hub/checkpoints/big-lama.pt
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "2",  memory: 2Gi }
          volumeMounts:
            - name: pvc
              mountPath: /pvc
      volumes:
        - name: pvc
          persistentVolumeClaim:
            claimName: folio-ai-models
