# folio-ai-edit — FOLIO 의 지우기 백엔드.
#
# 한 Deployment 다. 계획은 api / session / iopaint 를 나눠 그렸지만 같은 계획이
# "초기에는 하나로 합쳐도 된다" 고 적었고, 지금 셋의 부하 특성이 다르지 않다.
# 분리는 실제로 달라졌을 때 한다.
#
# replicas 1: LaMa CPU 추론은 코어를 몰아 쓴다. 단일 노드에서 두 벌을 띄우면
# 서로의 스레드를 뺏을 뿐 처리량이 늘지 않는다. 수평 확장은 노드가 늘 때 의미가 생긴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: folio-ai-edit
spec:
  replicas: 1
  strategy:
    # 노드가 하나고 이미지가 2GB 급이라 롤링으로 두 벌을 동시에 띄우면
    # 메모리와 페이지캐시를 두 배로 먹는다. 짧은 중단을 택한다.
    type: Recreate
  selector:
    matchLabels:
      app: folio-ai-edit
  template:
    metadata:
      labels:
        app: folio-ai-edit
    spec:
      # GHCR 패키지는 private 다 - 저장소가 public 이어도 패키지 기본값은 private.
      # 공개로 바꾸는 대신 justsend-* 와 같은 관례로 pull secret 을 쓴다.
      # 노출을 늘리지 않는 쪽을 고른다. 시크릿은 git 이 아니라 out-of-band 로 만든다.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # PVC 는 root 소유로 만들어진다. fsGroup 을 주면 kubelet 이 볼륨을
        # 이 그룹으로 넘겨줘 uid 10001 이 쓸 수 있다.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 가중치를 PVC 에 채운다.
        #
        # **PVC 를 /models 가 아니라 /pvc 에 붙인다.** /models 에 붙이면
        # 이미지에 구워진 레이어가 가려져서 복사할 원본이 사라진다. 여기서는
        # 이미지의 /models 가 그대로 보이므로 --seed-from 이 그 자리를 찾고,
        # 네트워크 없이 로컬 복사로 끝난다.
        #
        # bake 를 걷어내는 3단계 뒤에는 seed 가 없어 자연히 다운로드로
        # 떨어지지만, 그때 PVC 는 이미 차 있어 md5 확인만 한다.
        - name: prefetch
          image: ghcr.io/clab-one/folio-iopaint
          command:
            - python
            - -m
            - iopaint.prefetch
            - --seed-from
            - /models
            - lama
          env:
            # prefetch 가 쓸 캐시 루트를 PVC 쪽으로 돌린다. 이미지의
            # XDG_CACHE_HOME=/models 를 여기서만 덮는다.
            - name: XDG_CACHE_HOME
              value: /pvc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /pvc
      containers:
        - name: iopaint
          image: ghcr.io/clab-one/folio-iopaint
          args:
            - --model=lama
            - --device=cpu
            - --host=0.0.0.0
            - --port=8080
            - --model-dir=/models
            # 입장 제어. 무한 동시성이 컨테이너를 죽였다 - iopaint/admission.py.
            #
            # 1 이 아니라 5 인 이유: 로컬 CPU 를 지키는 일은 이제
            # LocalBackend 의 슬롯(1개)이 맡는다. 여기서 전부 직렬화하면
            # 로컬 CPU 를 쓰지도 않는 원격 호출까지 줄을 서고, 노드를 하나
            # 더 붙여도 처리량이 늘지 않는다 - 실측 conc=1..8 전부
            # 1.12 req/s 로 평평했고 로컬은 24건 중 0건을 처리했다.
            #
            # 5 는 백엔드 슬롯의 합(로컬 1 + 원격 1 = 2)보다 크다. 일부러다.
            #
            # 넘치는 셋은 백엔드 세마포어에서 기다리는데, 그 대기가 보인다 -
            # Scheduler._run 이 stats.enter() 를 슬롯 **밖**에서 잡으므로
            # 대기 중인 요청도 inflight 에 센다. 노드 선택식
            # estimated_ms = (inflight+1) x p50 이 그 줄을 그대로 반영한다.
            #
            # 즉 여기 여유분은 도착 폭을 흡수하는 짧은 줄이지 숨은 큐가 아니다.
            # 2 로 조이면 그만큼 일찍 503 이 난다.
            - --inflight=5
            - --max-queue=8
          ports:
            - name: http
              containerPort: 8080
          env:
            # 세션 작업공간. 계획 11 절의 tmpfs 경로다.
            - name: FOLIO_SESSION_DIR
              value: /session
            # tmpfs 예산. 세션 하나가 원본 + working 두 벌을 든다.
            # 32 × 64MiB × 2 = 4GiB 상한, volume sizeLimit 12Gi 안이다.
            # 넘으면 create 가 503 으로 거절한다 - 노드 RAM 을 지키는 쪽이 낫다.
            - name: FOLIO_MAX_SESSIONS
              value: "32"
            # 계획 11 절: TTL 20분. 클라이언트가 Done 을 부르지 않고 사라지는
            # 것은 정상 경로다. reaper 가 60초마다 훑는다.
            - name: FOLIO_SESSION_TTL
              value: "1200"
            # cgroup 할당량과 스레드 수를 일치시킨다.
            #
            # 컨테이너는 cpu.max=800000/100000 즉 8코어인데 torch 는 호스트의
            # 24코어를 보고 16스레드를 띄운다. 그러면 주기 초반에 할당량을 태우고
            # 남은 시간 얼어붙는다 - 800² 추론 한 번에 스로틀 111회, throttled
            # 85.8초, CPU 시간 89.6초. 8스레드로 맞추면 스로틀 10회, throttled
            # 66ms, CPU 시간 18.2초로 떨어지고 벽시계가 11.3초 → 2.3초가 된다.
            #
            # limits.cpu 를 바꾸면 이 값도 같이 바꿔야 한다. 둘은 같은 수다.
            - name: OMP_NUM_THREADS
              value: "8"
            - name: MKL_NUM_THREADS
              value: "8"
            # 두 번째 실행 자원 - M4 Max 의 Core ML 워커.
            #
            # 클러스터 밖이다. Kubernetes 노드로 넣지 않은 이유는 Core ML 이
            # macOS 사용자 세션에서만 ANE 를 쓸 수 있어서다. launchd 로 돌고
            # LAN 으로 부른다 - one.clab.folio.coreml-worker.
            #
            # 이건 힌트지 의존이 아니다. 워커가 꺼지면 스케줄러가 그 자리에서
            # 로컬로 되돌리고, 사용자는 느려질 뿐 세션이 깨지지 않는다.
            # 800² 기준 2870ms 대 142ms 라 켜질 때의 차이가 크다.
            - name: FOLIO_COREML_URL
              value: https://219.255.103.226:18443
            # 워커는 mTLS 로만 답한다. 이 셋이 빠지면 핸드셰이크가 매번
            # 실패하고 조용히 로컬로만 돈다 - test_deploy_consistency 가
            # URL 과 인증서가 함께 있는지 본다.
            - name: FOLIO_COREML_CA
              value: /pki/ca.crt
            - name: FOLIO_COREML_CERT
              value: /pki/client.crt
            - name: FOLIO_COREML_KEY
              value: /pki/client.key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            # 계획에 수치가 없어 여기서 정한다. LaMa 800² CPU 추론은 코어를
            # 몰아 쓰지만 상시 점유는 아니다 - requests 를 작게 잡아 노드의
            # 다른 워크로드 스케줄링을 막지 않고, limits 로 폭주만 자른다.
            # 노드 24 vCPU / 62Gi 중 현재 요청 24% / 16%.
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 16Gi
          # 프로브는 /healthz · /readyz 를 쓴다. 이전에는 셋 다
          # /api/v1/server-config 를 쳤는데, 그건 모델 매니저를 건드리는 sync
          # 엔드포인트라 부하 중 스레드풀에 갇혀 굶었다. 100건 버스트에서
          # liveness 가 3회 실패해 멀쩡한 컨테이너가 kill 됐다.
          startupProbe:
            # 이미지에 가중치가 구워져 있어도 torch.jit 적재에 시간이 걸린다.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            # 바쁨은 죽음이 아니다. /healthz 는 혼잡해도 200 이고,
            # 혼잡은 요청 쪽에서 503 + Retry-After 로 답한다.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 3
            # kubelet 기본이 1초다. /healthz 는 async 라 이벤트 루프에서
            # 답하므로 평소엔 1ms 도 안 걸리지만, 그 여유가 없으면 순간적인
            # 지연 한 번이 재시작 카운트를 올린다. 죽음의 판정 기준은
            # 넉넉해야 한다 - 살아 있는 컨테이너를 죽이는 쪽이 더 나쁘다.
            timeoutSeconds: 5
          volumeMounts:
            - name: session
              mountPath: /session
            # initContainer 가 채운 PVC 를 이미지의 캐시 자리에 겹친다.
            # 이 순간 baked 레이어는 가려지지만, 같은 파일이 PVC 에 있으므로
            # 보이는 결과는 같다. 3단계에서 bake 를 지우면 이것만 남는다.
            - name: models
              mountPath: /models
            - name: pki
              mountPath: /pki
              readOnly: true
      volumes:
        # 계획 11 절: 편집 세션은 tmpfs 에만 산다. 디스크에 남기지 않고 TTL 이나
        # Done 으로 사라진다. sizeLimit 은 상한이지 예약이 아니라 비어 있으면 0 이다.
        #
        # 지금 fork 의 API 는 무상태(/api/v1/inpaint)라 이 볼륨을 쓰지 않는다.
        # 세션 API 는 AI-003 이다. 그때 코드만 오면 되도록 배포 형태를 먼저 맞춘다.
        - name: session
          emptyDir:
            medium: Memory
            sizeLimit: 12Gi
        # 가중치는 반대다 - 세션은 사라져야 하고 가중치는 남아야 한다.
        # 이미지에 구우면 wave 3~5(SAM 최대 2.4GB, RealESRGAN, GFPGAN,
        # RestoreFormer)를 붙이는 순간 GB 급이 된다. 여기 두면 이미지는
        # 코드만 담고, 모델을 늘려도 재배포가 무거워지지 않는다.
        - name: models
          persistentVolumeClaim:
            claimName: folio-ai-models
        # M4 워커를 부를 클라이언트 인증서. ghcr-pull 과 같은 관례로 git 이
        # 아니라 out-of-band 로 만든다:
        #
        #   kubectl -n folio-ai create secret generic folio-coreml-client \
        #     --from-file=ca.crt=... --from-file=client.crt=... \
        #     --from-file=client.key=...
        #
        # optional 로 두지 않는다. 없으면 파드가 뜨지 않는 편이, 인증서 없이
        # 떠서 매번 핸드셰이크에 실패하며 조용히 느려지는 것보다 낫다.
        - name: pki
          secret:
            secretName: folio-coreml-client
            # 개인키다. 소유자만 읽는다.
            defaultMode: 0400
